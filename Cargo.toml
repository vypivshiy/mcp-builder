[workspace]
members = [
    "crates/mcp-builder-core",
    "crates/mcp-builder-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["std_mcp contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
kdl = "4.6"
minijinja = "2.7"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tempfile = "3.17"
